name: CI

# PR 提交时触发：Python lint/build + 前端（antd/React）lint/build。
# 保留 workflow_dispatch 以便手动重跑。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支新推送会取消仍在跑的旧检查，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 Dockerfile 的 python:3.12-slim 对齐
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'ruff==0.17.3'

      - name: Lint (ruff)
        run: ruff check .

      # 构建检查：完整安装依赖后 smoke import，能拦住缺依赖 / 顶层导入炸裂
      - name: Build check (import smoke test)
        run: python -c "import main; print('import main OK')"

  front:
    name: Frontend lint & build (antd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      # 与 Dockerfile 的 node:22-alpine 对齐
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
