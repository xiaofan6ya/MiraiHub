// aliyun 镜像为国内本地构建提速；GitHub Actions 等海外 CI 访问 aliyun 常年 502，
// 会直接打断依赖解析，因此 CI 环境（CI=true）跳过镜像、直连官方源。
def useAliyunMirror = System.getenv('CI') != 'true'

pluginManagement {
    repositories {
        if (useAliyunMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (useAliyunMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = 'WorkBuddy2APIAndroid'
include ':app'
