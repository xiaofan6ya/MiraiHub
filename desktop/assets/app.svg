<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="MiraiHub">
  <!--
    MiraiHub 应用图标 —— 以**网页版** admin/ui/public/favicon.svg 为基准统一（2026-11-28）。

    之前三端是两套东西：网页 favicon 是「深色底 + 银灰 M」，桌面/安卓是「蓝底 + 星形拓扑」。
    用户确认以网页版为准，这里把 40×40 的 favicon 等比放大到 256 画布并做小尺寸补偿：
      1. 底板圆角 12→77（等比），底色 #1B2936 与 favicon 完全一致；
      2. M 字形按 65% 画布宽重排（favicon 里它几乎顶满，直接放大会糊边）；
      3. 描边 3.2→22（等比 20.5，再补一点让小尺寸下更结实）；
      4. 右上圆点保留，是 favicon 的识别细节。

    备份：改动前的星形拓扑版在 temp/icon-backup/app-topology.svg。
  -->
  <defs>
    <linearGradient id="mh-m" x1="45" y1="62" x2="211" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6EEF5" />
      <stop offset=".52" stop-color="#B5C5D4" />
      <stop offset="1" stop-color="#88A6BB" />
    </linearGradient>
    <linearGradient id="mh-plate" x1="20" y1="16" x2="236" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22323F" />
      <stop offset=".55" stop-color="#1B2936" />
      <stop offset="1" stop-color="#131E28" />
    </linearGradient>
  </defs>

  <!-- 底板：与 favicon 同色，加一层极淡的对角渐变避免平板感 -->
  <rect x="0" y="0" width="256" height="256" rx="77" fill="url(#mh-plate)" />

  <!-- M 字形（favicon 的 M11 28V12.5l9.5 9 9.5-9V28，等比 ×8.74 后居中于 128,128） -->
  <path d="M45 198 V62 L128 141 L211 62 V198"
        fill="none" stroke="url(#mh-m)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- 右上角识别圆点 -->
  <circle cx="219" cy="42" r="17" fill="#88A6BB" />
</svg>
