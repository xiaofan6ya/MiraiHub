<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<title>MiraiHub 注册</title>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --brand:#4176e6; --brand-hover:#5a86f0; --brand-rgb:65,118,230;
    --brand-ink:#2f5cbf; --brand-soft:rgba(65,118,230,.10);
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eef1f6;
    --border:#e5e9f0; --line:#dfe3e8;
    --fg:#101828; --fg-muted:#5b6472; --fg-subtle:#7b8494;
    --ok:#12a150; --ok-soft:rgba(18,161,80,.12);
    --danger:#e00009; --danger-soft:rgba(224,0,9,.10);
    --on-brand:#ffffff;
    --r-sm:9px; --r:12px; --r-lg:18px;
    --sh-1:0 1px 2px rgba(16,24,40,.04);
    --sh-2:0 2px 6px rgba(16,24,40,.05), 0 18px 44px rgba(16,24,40,.08);
    --ease:cubic-bezier(.38,0,.24,1);
    --font:"Inter","Inter Variable","Segoe UI Variable Text","Segoe UI",
           "PingFang SC","HarmonyOS Sans SC","Noto Sans SC",
           "Microsoft YaHei UI","Hiragino Sans GB",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#5385f2; --brand-hover:#6a94f8; --brand-rgb:83,133,242;
      --brand-ink:#9dbcff; --brand-soft:rgba(83,133,242,.20);
      --bg:#0d0f13; --surface:#161920; --surface-2:#1c2028; --surface-3:#242933;
      --border:#262b35; --line:#2c323d;
      --fg:#e8ebf0; --fg-muted:#9aa3b3; --fg-subtle:#79828f;
      --ok:#2ad07a; --ok-soft:rgba(42,208,122,.15);
      --danger:#ff7a7a; --danger-soft:rgba(255,122,122,.14);
      --sh-1:0 1px 2px rgba(0,0,0,.35);
      --sh-2:0 2px 6px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.45);
    }
  }
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(820px 520px at 88% -10%, rgba(var(--brand-rgb),.13), transparent 62%),
      radial-gradient(600px 420px at -10% 30%, rgba(var(--brand-rgb),.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--fg);
    font-family:var(--font);
    font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:20px 16px;
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    padding-bottom:max(20px, env(safe-area-inset-bottom));
  }
  .shell{width:100%; max-width:420px}
  .card{
    width:100%; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sh-2); padding:26px 24px 22px;
    animation:card-in .3s var(--ease) both;
  }
  @keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (max-width:480px){
    body{padding:0;justify-content:flex-start}
    .shell{max-width:none}
    .card{border-radius:0;border:0;min-height:100vh;box-shadow:none;
      padding:24px 18px 28px;
      padding-top:max(24px, env(safe-area-inset-top))}
    .legal{padding:0 20px 18px}
  }

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .mark{
    width:40px;height:40px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--brand-hover));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(var(--brand-rgb),.32);
  }
  .mark svg{width:21px;height:21px;fill:#fff}
  .brand-text{display:flex;flex-direction:column;min-width:0}
  .brand-text .name{font-size:16.5px;font-weight:650;letter-spacing:.2px;line-height:1.3}
  .brand-text .tag{font-size:11.5px;color:var(--fg-subtle);line-height:1.5}

  .intro{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r); padding:13px 15px; margin-bottom:18px;
    box-shadow:var(--sh-1);
  }
  .intro p{margin:0;font-size:12.5px;line-height:1.78;color:var(--fg-muted)}
  .intro p+p{margin-top:6px}
  .intro b{color:var(--fg);font-weight:600}

  .closed{
    border:1px dashed var(--line); border-radius:var(--r);
    background:var(--surface-2); padding:22px 18px; text-align:center;
    margin-bottom:16px;
  }
  .closed .closed-ico{
    width:44px;height:44px;margin:0 auto 10px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-3); color:var(--fg-subtle);
  }
  .closed .closed-ico svg{width:22px;height:22px}
  .closed .closed-title{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--fg)}
  .closed .closed-desc{margin:0;font-size:12.5px;line-height:1.7;color:var(--fg-muted)}

  .plats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
  .plat{
    border:1px solid var(--border); border-radius:999px; padding:8px 16px;
    font-size:13px; color:var(--fg-muted); background:var(--surface);
    cursor:pointer; font-family:inherit; min-height:36px; line-height:1.4;
    transition:border-color .16s var(--ease), color .16s var(--ease),
               background .16s var(--ease), box-shadow .16s var(--ease);
  }
  .plat:hover{border-color:var(--brand-soft); color:var(--fg)}
  .plat.on{
    border-color:transparent; color:var(--on-brand); font-weight:600;
    background:linear-gradient(135deg,var(--brand),var(--brand-hover));
    box-shadow:0 4px 12px rgba(var(--brand-rgb),.28);
  }

  .steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
  .steps i{width:30px;height:3px;border-radius:2px;background:var(--border);display:block;transition:background .2s}
  .steps i.on{background:var(--brand)}
  h1#platTitle{margin:0 0 6px;font-size:17px;font-weight:650;text-align:center;line-height:1.4}
  .sub{text-align:center;color:var(--fg-muted);font-size:12.5px;line-height:1.7;margin:0 0 18px}

  label{display:block;font-size:12px;color:var(--fg-muted);margin-bottom:6px;font-weight:500}
  .field{
    display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--r);
    min-height:50px;padding:0 12px;background:var(--surface);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .field:hover{border-color:var(--brand-soft)}
  .field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .field select{
    appearance:none;-webkit-appearance:none;flex:0 0 auto;max-width:130px;
    border:0;outline:0;font-size:13px;background:transparent;color:var(--fg);
    font-family:inherit;height:46px;cursor:pointer;padding-right:8px;
    border-right:1px solid var(--line);margin-right:10px;
  }
  .field input{
    flex:1;min-width:0;border:0;outline:0;font-size:16px;background:transparent;
    color:var(--fg);font-family:inherit;letter-spacing:.4px;height:46px;
  }
  .field input::placeholder{color:var(--fg-subtle);letter-spacing:0;font-size:14px}
  .field.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
  .row{margin-bottom:14px}

  .btn{
    width:100%;min-height:50px;border:0;border-radius:var(--r);
    background:linear-gradient(135deg,var(--brand),var(--brand-hover));
    color:var(--on-brand);font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;box-shadow:0 6px 16px rgba(var(--brand-rgb),.26);
    transition:filter .16s var(--ease), transform .06s var(--ease), box-shadow .16s var(--ease);
  }
  .btn:hover:not(:disabled){filter:brightness(1.05)}
  .btn:active:not(:disabled){transform:scale(.988);box-shadow:0 3px 10px rgba(var(--brand-rgb),.22)}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
  .btn.ghost{
    background:var(--surface);color:var(--fg);border:1px solid var(--border);
    box-shadow:none;font-weight:500;
  }
  .btn.ghost:hover:not(:disabled){background:var(--surface-2);filter:none}

  .note{font-size:12px;color:var(--fg-muted);margin-top:12px;line-height:1.7}
  .alt{text-align:center;margin-top:12px}
  .alt a{color:var(--fg-subtle);font-size:12px;text-decoration:none;
    cursor:pointer;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
  .alt a:hover{color:var(--brand);border-bottom-color:var(--brand)}
  .hidden{display:none !important}

  .qrbox{
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:14px;margin-bottom:14px;box-shadow:var(--sh-1);
  }
  .qrbox img{width:192px;height:192px;display:block;border-radius:6px}

  .auth-hint{margin:0 0 12px;font-size:12.5px;line-height:1.75;color:var(--fg-muted);text-align:center}
  .auth-btn{display:flex;align-items:center;justify-content:center;
    text-decoration:none;letter-spacing:.2px}
  .auth-btn:hover{filter:brightness(1.05)}

  .selbtn{
    width:100%;min-height:48px;border:1px solid var(--border);border-radius:var(--r);
    background:var(--surface);color:var(--fg);font-size:14px;font-family:inherit;
    cursor:pointer;margin-bottom:8px;transition:border-color .15s,color .15s,background .15s;
    padding:0 14px;text-align:left;
  }
  .selbtn:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
  .selbtn:disabled{opacity:.55;cursor:not-allowed}

  .waiting{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:16px;color:var(--fg-muted);font-size:12.5px}

  .result{text-align:center;padding:12px 0 4px}
  .result .icon{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .result .icon.ok{background:var(--ok-soft);color:var(--ok)}
  .result .icon svg{width:30px;height:30px}
  .result .title{font-size:17px;font-weight:650;margin-bottom:6px;color:var(--fg)}
  .result .desc{font-size:13px;color:var(--fg-muted);line-height:1.75;word-break:break-word}
  .result .desc b{color:var(--fg);font-weight:600}

  .spin{width:15px;height:15px;border:2px solid rgba(var(--brand-rgb),.25);
    border-top-color:var(--brand);border-radius:50%;display:inline-block;
    vertical-align:-3px;margin-right:6px;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast-wrap{position:fixed;left:0;right:0;top:14px;z-index:99;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;padding:0 16px}
  .toast{
    max-width:360px;background:rgba(18,20,26,.95);color:#fff;
    font-size:12.5px;line-height:1.55;padding:10px 14px;border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.28);
    display:flex;align-items:flex-start;gap:8px;
    animation:tin .22s var(--ease) both;word-break:break-word
  }
  .toast.out{animation:tout .2s ease-in forwards}
  .toast svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-8px)}}

  .ferr{color:var(--danger);font-size:12px;margin-top:7px;display:none;line-height:1.6}
  .ferr.show{display:block}

  .foot{text-align:center;color:var(--fg-subtle);font-size:11.5px;
    margin-top:18px;padding-top:14px;border-top:1px solid var(--border);line-height:1.65}
  .foot:empty{display:none}
  .legal{max-width:420px;margin:12px auto 0;text-align:center;
    font-size:11px;color:var(--fg-subtle);line-height:1.6}
  .stale{opacity:.4}
</style>
</head>
<body>
<div class="toast-wrap" id="toasts"></div>
<div class="shell">
  <div class="card">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3 6.5 3.6-2.06 1.15L12 6.6 7.56 9.05 5.5 7.9 12 4.3zM5 9.6l2 1.12v4.56l-2-1.11V9.6zm4 2.24 3 1.67 3-1.67v3.12l-3 1.67-3-1.67v-3.12zm8-2.24v4.57l-2 1.11V10.7l2-1.1z"/></svg>
      </span>
      <span class="brand-text">
        <span class="name">MiraiHub</span>
        <span class="tag" id="brandTag">公益共享 · 自助注册</span>
      </span>
    </div>

    <div id="introBox" class="intro hidden">
      <p id="copyLine1"></p>
      <p id="copyLine2"></p>
      <p id="copyLine3"></p>
      <p id="copyLine4" class="hidden"></p>
      <p id="copyLine5" class="hidden"></p>
      <p id="copyLine6" class="hidden"></p>
    </div>

    <div id="closedBox" class="closed hidden">
      <div class="closed-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <p class="closed-title">当前未开放自助注册</p>
      <p class="closed-desc">入口只在管理员开启并分发访问链接时可用。如果你手上是旧链接，请重新索取一个新的。</p>
    </div>

    <div id="platBar" class="plats hidden" role="tablist" aria-label="选择平台"></div>

    <div id="stepForm" class="hidden">
      <div class="steps"><i class="on"></i><i class="on"></i></div>
      <h1 id="platTitle">注册</h1>
      <p class="sub" id="platSub"></p>

      <div id="platQR" class="qrbox hidden"><img id="platQRImg" alt="登录二维码" /></div>

      <div id="platAuth" class="hidden">
        <p class="auth-hint">点下面的按钮打开官方授权页，用同一台手机完成登录；授权成功后回到本页，结果会自动出现。</p>
        <a id="platAuthBtn" class="btn auth-btn" rel="noopener noreferrer" target="_blank">打开授权页面</a>
      </div>

      <div id="platSms" class="hidden">
        <div class="row">
          <label for="pMobile">手机号</label>
          <div class="field" id="pMobileField">
            <select id="pCountry" aria-label="地区">
              <option value="86">+86 中国大陆</option><option value="852">+852 中国香港</option><option value="853">+853 中国澳门</option>
            </select>
            <input id="pMobile" type="tel" inputmode="numeric" autocomplete="tel"
                   maxlength="11" placeholder="请输入手机号" />
          </div>
        </div>
        <button id="pSendBtn" class="btn">获取验证码</button>
      </div>

      <div id="platCode" class="hidden">
        <div class="row">
          <label for="pCode">短信验证码</label>
          <div class="field" id="pCodeField">
            <input id="pCode" type="tel" inputmode="numeric" maxlength="8"
                   placeholder="输入收到的验证码" />
          </div>
          <div class="ferr" id="pCodeErr"></div>
        </div>
        <div class="row hidden" id="platPwdRow">
          <label for="pPwd">设置密码（新账号需要，用于后续续期）</label>
          <div class="field" id="pPwdField">
            <input id="pPwd" type="password" maxlength="64" autocomplete="new-password"
                   placeholder="至少 6 位" />
          </div>
        </div>
        <button id="pVerifyBtn" class="btn">注册</button>
      </div>

      <div id="platSelect" class="hidden">
        <p class="sub">该手机号下有多个账号，请选择要注册的账号</p>
        <div id="platSelList"></div>
      </div>

      <div class="waiting hidden" id="platWait">
        <span class="spin"></span><span id="platWaitTip">等待扫码…</span>
      </div>
      <div class="ferr" id="platErr"></div>
      <div class="alt"><a href="javascript:void(0)" id="platBack">返回重选平台</a></div>
    </div>

    <div id="step3" class="hidden">
      <div class="result">
        <div class="icon ok" id="resIcon"></div>
        <div class="title" id="resTitle"></div>
        <div class="desc" id="resDesc"></div>
      </div>
      <div class="note" id="resHint" style="text-align:center"></div>
      <button id="againBtn" class="btn ghost hidden" style="margin-top:18px">返回</button>
    </div>

    <div class="foot" id="footNote"></div>
  </div>
  <p class="legal">本页只负责把你的账号接入共享池，不会向你索取任何密码或验证码。</p>
</div>

<link rel="stylesheet" href="/static/phone-region.css" />
<script src="/static/phone-session.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var COPY_SUB = "";

  function renderRich(el, text) {
    while (el.firstChild) el.removeChild(el.firstChild);
    var parts = String(text == null ? "" : text).split("**");
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      if (i % 2 === 1) {
        var b = document.createElement("b");
        b.textContent = parts[i];
        el.appendChild(b);
      } else {
        el.appendChild(document.createTextNode(parts[i]));
      }
    }
  }

  function applyCopy(copy) {
    var c = copy || {};
    document.title = c.title || "MiraiHub 注册";
    if (c.sub) COPY_SUB = c.sub;
    var lines = c.intro || [];
    var intro = $("introBox");
    if (intro) intro.classList.toggle("hidden", !lines.length);
    for (var i = 0; i < 6; i++) {
      var el = $("copyLine" + (i + 1));
      if (!el) continue;
      if (i < lines.length) {
        el.classList.remove("hidden");
        renderRich(el, lines[i]);
        if (i === 0) el.style.color = "var(--fg)";
      } else {
        el.classList.add("hidden");
      }
    }
    if (c.foot) $("footNote").textContent = c.foot;
  }

  function api(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = {};
        try { d = t ? JSON.parse(t) : {}; } catch (e) { d = { detail: t }; }
        return { ok: r.ok, status: r.status, data: d,
                 retryAfter: Number(r.headers.get("Retry-After")) || 0 };
      });
    });
  }

  function msgOf(data) {
    var d = data && data.detail;
    if (!d) return "操作失败，请稍后重试";
    if (typeof d === "string") return d;
    return d.message || "操作失败，请稍后重试";
  }

  var TOAST_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#ff9d9d" stroke-width="2.2" ' +
    'stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/>' +
    '<circle cx="12" cy="16.5" r="1" fill="#ff9d9d" stroke="none"/></svg>';

  function toast(msg, ms) {
    var wrap = $("toasts");
    if (!wrap) return;
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = TOAST_ICON + "<span></span>";
    el.lastChild.textContent = String(msg == null ? "" : msg);
    wrap.appendChild(el);
    while (wrap.children.length > 3) wrap.removeChild(wrap.firstChild);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, ms || 2600);
  }

  var OK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function show(id) {
    ["stepForm", "step3"].forEach(function (k) {
      $(k).classList.toggle("hidden", k !== id);
    });
    var intro = $("introBox");
    if (intro) intro.classList.toggle("hidden", id === "step3");
    if (id !== "stepForm") hideClosed();
  }

  function hideClosed() {
    var box = $("closedBox");
    if (box) box.classList.add("hidden");
  }

  var plats = [], curPlat = "", uSid = "", uTimer = null, uDead = 0,
      uPollMs = 3000, uFail = 0, uBusy = false, uCdown = null, uNeedPwd = false;

  function loadPlatforms() {
    fetch("/api/open/platforms", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("closed");
      return r.json();
    }).then(function (d) {
      plats = (d && d.platforms) || [];
      if (d && d.copy) applyCopy(d.copy);
      if (!plats.length) { showClosed(); return; }
      renderPlatChips();
      $("platBar").classList.remove("hidden");
      pickPlat((d && d.default) || plats[0].id, true);
    }).catch(function () { showClosed(); });
  }

  function showClosed() {
    var intro = $("introBox");
    if (intro) intro.classList.add("hidden");
    $("platBar").classList.add("hidden");
    ["stepForm", "step3"].forEach(function (k) {
      var el = $(k);
      if (el) el.classList.add("hidden");
    });
    var box = $("closedBox");
    if (box) box.classList.remove("hidden");
  }

  function renderPlatChips() {
    var bar = $("platBar");
    while (bar.firstChild) bar.removeChild(bar.firstChild);
    plats.forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "plat" + (p.id === curPlat ? " on" : "");
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", p.id === curPlat ? "true" : "false");
      b.textContent = String(p.label || p.id);
      b.addEventListener("click", function () { pickPlat(p.id, false); });
      bar.appendChild(b);
    });
  }

  function platHasMode(m) {
    for (var i = 0; i < plats.length; i++) {
      if (plats[i].id === curPlat) return (plats[i].modes || []).indexOf(m) >= 0;
    }
    return false;
  }

  function pickPlat(id, silent, force) {
    if (uBusy) return;
    if (!force && id === curPlat && silent) return;
    platStop();
    curPlat = id;
    uNeedPwd = false;
    renderPlatChips();
    var label = "";
    for (var i = 0; i < plats.length; i++) if (plats[i].id === id) label = plats[i].label;
    $("platTitle").textContent = (label || "") + " · 注册";
    $("platSub").textContent = COPY_SUB ||
      "手机号验证或扫码授权，完成后账号自动加入共享池";
    platErr("");
    ["platQR", "platSms", "platCode", "platSelect", "platWait", "platPwdRow", "platAuth"].forEach(function (k) {
      $(k).classList.add("hidden");
    });
    show("stepForm");
    if (platHasMode("qr")) { platBegin("qr"); return; }
    if (platHasMode("auth_url")) { platBegin("auth_url"); return; }
    if (platHasMode("sms")) { platShowSms(); return; }
    if (!silent) toast("该平台暂未开放自助注册");
    showClosed();
  }

  function platStop() {
    if (uTimer) { clearTimeout(uTimer); uTimer = null; }
    if (uCdown) { clearInterval(uCdown); uCdown = null; }
    if (uSid && curPlat) {
      api("/api/open/" + encodeURIComponent(curPlat) + "/cancel",
          { session: uSid }).catch(function () {});
    }
    uSid = "";
  }

  function platErr(msg) {
    var el = $("platErr");
    if (el) { el.textContent = msg || ""; el.classList.toggle("show", !!msg); }
  }

  function platWait(on, tip) {
    var w = $("platWait");
    if (w) w.classList.toggle("hidden", !on);
    if (tip !== undefined) $("platWaitTip").textContent = tip;
  }

  function platBegin(mode) {
    platErr("");
    platWait(true, mode === "qr" ? "正在生成二维码…" : "正在准备授权页面…");
    $("platAuth").classList.add("hidden");
    api("/api/open/" + encodeURIComponent(curPlat) + "/begin",
        { mode: mode }).then(function (r) {
      if (!r.ok) throw { data: r.data };
      var d = r.data || {};
      uSid = d.session || "";
      uDead = Date.now() + (Number(d.expires_in) || 300) * 1000 + 8000;
      uPollMs = Math.max(2500, Number(d.poll_interval) || 3000);
      uFail = 0;
      if (d.qr_svg_data_uri) {
        $("platQRImg").src = String(d.qr_svg_data_uri);
        $("platQR").classList.remove("hidden");
        platWait(true, "请用手机 App 扫码并确认");
      } else if (d.qr_base64) {
        $("platQRImg").src = "data:image/png;base64," + String(d.qr_base64);
        $("platQR").classList.remove("hidden");
        platWait(true, "请用手机 App 扫码并确认");
      } else if (d.auth_url) {
        var link = $("platAuthBtn");
        if (link) link.setAttribute("href", String(d.auth_url));
        $("platAuth").classList.remove("hidden");
        platWait(true, "在授权页完成登录后，本页会自动显示结果");
      } else if (d.user_code) {
        $("platAuth").classList.remove("hidden");
        platWait(true, "请按授权页提示确认，完成后本页自动显示结果");
      } else {
        platWait(true, "等待结果…");
      }
      platLoop();
    }).catch(function (e) {
      platWait(false);
      platErr(msgOf(e && e.data));
    });
  }

  function platLoop() {
    if (!uSid || uTimer) return;
    var tick = function () {
      uTimer = null;
      if (!uSid) return;
      if (document.hidden) { uTimer = setTimeout(tick, 4000); return; }
      if (Date.now() > uDead) {
        platWait(false);
        platErr("等待超时，请点「返回重选平台」重新开始");
        return;
      }
      fetch("/api/open/" + encodeURIComponent(curPlat) + "/poll?session=" +
            encodeURIComponent(uSid), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var st = d && d.status;
          if (st === "done") { platWait(false); platOk(d.account); return; }
          if (st === "expired") {
            platWait(false);
            platErr("二维码已过期，请点「返回重选平台」重新开始");
            return;
          }
          if (st === "failed") {
            platWait(false);
            platErr((d && d.message) || "授权未完成，请重新开始");
            return;
          }
          if (st === "select_account") {
            platWait(false);
            platRenderSelect(d.accounts || []);
            return;
          }
          uFail = Math.min(uFail + 1, 5);
          uPollMs = Math.min(6000, uPollMs + 250 * uFail);
          uTimer = setTimeout(tick, uPollMs);
        })
        .catch(function () {
          uFail = Math.min(uFail + 1, 5);
          uTimer = setTimeout(tick, Math.min(8000, uPollMs + 1000 * uFail));
        });
    };
    uTimer = setTimeout(tick, uPollMs);
  }

  function platRenderSelect(list) {
    var box = $("platSelList");
    while (box.firstChild) box.removeChild(box.firstChild);
    (list || []).forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "selbtn";
      b.textContent = String(a.name || "账号") + " · " + String(a.type || "");
      b.addEventListener("click", function () {
        b.disabled = true; b.textContent = "登录中…";
        api("/api/open/" + encodeURIComponent(curPlat) + "/select",
            { session: uSid, sec_uid: String(a.sec_uid || "") })
          .then(function (r) {
            if (r.ok && r.data && r.data.status === "done") {
              platOk(r.data.account);
            } else { platErr(msgOf(r.data)); b.disabled = false; }
          })
          .catch(function () { platErr("网络异常，请重试"); b.disabled = false; });
      });
      box.appendChild(b);
    });
    $("platSelect").classList.remove("hidden");
  }

  function platShowSms() {
    $("platQR").classList.add("hidden");
    $("platSelect").classList.add("hidden");
    $("platCode").classList.add("hidden");
    $("platPwdRow").classList.add("hidden");
    $("platSms").classList.remove("hidden");
    platWait(false);
    $("platSub").textContent = COPY_SUB ||
      "输入手机号，获取短信验证码完成注册";
    try { WBPhone.mountRegion($("pCountry"), $("pMobile")); } catch (e) {}
  }

  function platSendSms() {
    if (uBusy) return;
    platErr("");
    var mobile = ($("pMobile").value || "").replace(/\D/g, "");
    var country = $("pCountry").value || "86";
    try {
      if (!WBPhone.valid(country, mobile)) { platErr("请输入所选地区的有效手机号"); return; }
    } catch (e) {}
    uBusy = true;
    var btn = $("pSendBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>发送中…';
    api("/api/open/" + encodeURIComponent(curPlat) + "/sms/send",
        { mobile: mobile, country: country }).then(function (r) {
      if (!r.ok) throw { data: r.data, retry: r.retryAfter };
      var d = r.data || {};
      uSid = d.session || "";
      uDead = Date.now() + (Number(d.expires_in) || 300) * 1000 + 8000;
      $("platSms").classList.add("hidden");
      $("platCode").classList.remove("hidden");
      platCdown(Math.max(60, Number(d.retry_after) || 60));
      $("pCode").focus();
    }).catch(function (e) {
      platErr(msgOf(e && e.data));
      if (e && e.retry) platCdown(e.retry);
    }).then(function () {
      uBusy = false;
      btn.disabled = false;
      btn.textContent = "获取验证码";
    });
  }

  function platCdown(sec) {
    var left = Math.max(0, sec);
    var tick = function () {
      var b = $("pSendBtn");
      left = Math.max(0, left - 1);
      if (left <= 0) {
        if (uCdown) { clearInterval(uCdown); uCdown = null; }
        if (b) { b.disabled = false; b.textContent = "重新发送"; }
        return;
      }
      if (b) { b.disabled = true; b.textContent = left + "s"; }
    };
    tick();
    if (uCdown) clearInterval(uCdown);
    uCdown = setInterval(tick, 1000);
  }

  function platVerify() {
    if (uBusy || !uSid) return;
    platErr("");
    var code = ($("pCode").value || "").replace(/\D/g, "");
    if (code.length < 4) { platErr("请输入收到的验证码"); return; }
    var pwd = uNeedPwd ? ($("pPwd").value || "") : "";
    if (uNeedPwd && pwd.length < 6) { platErr("请设置至少 6 位的密码"); return; }
    uBusy = true;
    var btn = $("pVerifyBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>注册中…';
    api("/api/open/" + encodeURIComponent(curPlat) + "/sms/verify",
        { session: uSid, code: code, password: pwd })
      .then(function (r) {
        var d = r.data || {};
        if (r.ok && d.status === "done") { platOk(d.account); return; }
        if (r.ok && d.status === "need_password") {
          uNeedPwd = true;
          $("platPwdRow").classList.remove("hidden");
          platErr("新账号需要设置密码，请填写后重新提交");
          return;
        }
        if (r.ok && d.status === "select_account") {
          platRenderSelect(d.accounts || []);
          return;
        }
        platErr(msgOf(d));
      })
      .catch(function () { platErr("网络异常，请检查网络后重试"); })
      .then(function () {
        uBusy = false;
        btn.disabled = false;
        btn.textContent = "注册";
      });
  }

  function platOk(account) {
    platStop();
    uNeedPwd = false;
    $("resIcon").className = "icon ok";
    $("resIcon").innerHTML = OK_ICON;
    $("resTitle").textContent = "注册成功";
    $("resDesc").textContent = "";
    $("resDesc").appendChild(document.createTextNode("欢迎，"));
    var b = document.createElement("b");
    b.textContent = String((account && account.name) || "") || "账号";
    $("resDesc").appendChild(b);
    $("resHint").textContent = "可以关闭本页面了。";
    $("againBtn").classList.remove("hidden");
    $("platBar").classList.add("hidden");
    show("step3");
  }

  $("pSendBtn").addEventListener("click", platSendSms);
  $("pVerifyBtn").addEventListener("click", platVerify);
  $("pMobile").addEventListener("keydown", function (e) {
    if (e.key === "Enter") platSendSms();
  });
  $("pCode").addEventListener("keydown", function (e) {
    if (e.key === "Enter") platVerify();
  });
  $("pMobile").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "");
  });
  $("pCode").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "");
  });
  $("pCountry").addEventListener("change", function () {
    $("pMobile").maxLength = this.value === "86" ? 11 : 8;
  });
  $("platBack").addEventListener("click", function () {
    platStop();
    uNeedPwd = false;
    $("pCode").value = ""; $("pPwd").value = ""; $("pMobile").value = "";
    platErr("");
    pickPlat(curPlat || "workbuddy", true, true);
  });
  $("againBtn").addEventListener("click", function () {
    pickPlat(curPlat || "workbuddy", true, true);
  });

  loadPlatforms();
})();
</script>
</body>
</html>
