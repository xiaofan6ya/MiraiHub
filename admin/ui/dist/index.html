    <!--
      首屏占位（第五阶段「性能」项）。

      为什么放在 HTML 里：没有这段的话，浏览器要等 index.js（≈128KB gzip）下载、
      解析、执行完才第一次绘制，FCP 只能落在 2.9s 左右（Lighthouse mobile）。

      三条纪律：
        1) 只用 tokens.css 里的同值常量。内联样式在外部样式表之前解析，用不了 var()，
           所以这里把 --bg / --surface / --border / --fg-muted / --topbar-h 等抄成字面量；
           改令牌时这段也要跟着改（值必须一致，否则会看到换色闪烁）。
        2) 不引入任何新视觉元素：只有顶栏底色、两条灰条、一行提示文字。提示文字是
           FCP 的必要条件 —— 纯色块不算一次内容绘制，浏览器不会因此上报 FCP。
        3) 不需要拆除脚本：Vue 挂载时会清空 #app 的子节点，这段骨架自然消失。
    -->

        background: #ffffff;

        display: block;
        border-radius: 5px;
        background: #edeff3;
      }

      }
      .mh-boot__line {
        height: 64px;
        border: 1px solid #edeff3;
        border-radius: 10px;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #12151b;
          color: #e6e9ef;
        }
        .mh-boot {
          background: #12151b;
        }
        .mh-boot__top {
          background: #1a1e26;
          border-bottom-color: #2b303b;
        }
        .mh-boot__bar {
          background: #20242d;
        }
        .mh-boot__hint {
          color: #8d95a3;
        }
        .mh-boot__line {
          border-color: #242833;

      html[data-theme="light"] {

      html[data-theme="dark"] {
        background: #12151b;
        color: #e6e9ef;
      }
      html[data-theme="dark"] .mh-boot {
        background: #12151b;
      }
      html[data-theme="dark"] .mh-boot__top {
        background: #1a1e26;
        border-bottom-color: #2b303b;
      }
      html[data-theme="dark"] .mh-boot__bar {
