<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- 应用自带深色主题：声明给 Dark Reader 等反色插件，别再二次反色（第 1 轮审查 P0-1）。 -->
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiraiHub 管理后台</title>
    <!--
      字体（11-polish-motion §2）：IBM Plex Sans 拉丁子集 400 / 500 预加载，构建时由 vite.config.ts 的
      mh-preload-fonts 把下面的占位换成带哈希的 <link rel="preload" as="font" crossorigin>。
      @font-face 来自 @fontsource（main.ts 引入），已是 font-display: swap：字体没到之前先用系统字体，不白屏不阻塞。
      首屏占位里的「正在加载…」是中文，不依赖 Plex。
    -->
    <!-- mh:font-preload -->
    <!--
      首屏占位（第五阶段「性能」项）。

      为什么放在 HTML 里：没有这段的话，浏览器要等 index.js（≈128KB gzip）下载、
      解析、执行完才第一次绘制，FCP 只能落在 2.9s 左右（Lighthouse mobile）。

      三条纪律：
        1) 只用 tokens.css 里的同值常量。内联样式在外部样式表之前解析，用不了 var()，
           所以这里把 --bg / --surface / --border / --fg-muted / --topbar-h 等抄成字面量；
           改令牌时这段也要跟着改（值必须一致，否则会看到换色闪烁）。
        2) 不引入任何新视觉元素：只有深墨蓝侧栏（≥768）、顶栏底色、两条灰条、一行提示文字
           （v2.1 外壳：10-visual-refresh §1.2；侧栏颜色两种主题都是深色）。提示文字是
           FCP 的必要条件 —— 纯色块不算一次内容绘制，浏览器不会因此上报 FCP。
        3) 不需要拆除脚本：Vue 挂载时会清空 #app 的子节点，这段骨架自然消失。
    -->
    <style>
      html {
        background: #f3f5f8;
        color: #171a21;
        font-family: "IBM Plex Sans", "PingFang SC", "HarmonyOS Sans SC", "MiSans",
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
        font-size: 14px;
        line-height: 22px;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      #app {
        min-height: 100vh;
      }
      .mh-boot {
        display: flex;
        min-height: 100vh;
        background: #f3f5f8;
      }
      .mh-boot__side {
        flex: 0 0 auto;
        width: 232px;
        background: #121829;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }
      .mh-boot__col {
        flex: 1 1 auto;
        min-width: 0;
      }
      .mh-boot__top {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 56px;
        padding: 0 24px;
        background: #f4f6fa;
        border-bottom: 1px solid #edeff3;
      }
      .mh-boot__bar {
        display: block;
        border-radius: 6px;
        background: #e9ecf1;
      }
      .mh-boot__bar--title {
        width: 120px;
        height: 14px;
      }
      .mh-boot__main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 24px 32px;
      }
      .mh-boot__hint {
        margin: 0;
        font-size: 12px;
        line-height: 18px;
        color: #6b7280;
      }
      .mh-boot__lines {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 12px;
      }
      .mh-boot__line {
        height: 96px;
        border: 1px solid #e3e6ec;
        border-radius: 12px;
        background: #ffffff;
      }
      @media (max-width: 1279px) {
        .mh-boot__side {
          width: 64px;
        }
        .mh-boot__main {
          padding: 24px;
        }
      }
      @media (max-width: 767px) {
        .mh-boot__side {
          display: none;
        }
        .mh-boot__top {
          padding: 0 16px;
        }
        .mh-boot__main {
          padding: 16px;
        }
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #12151b;
          color: #e6e9ef;
        }
        .mh-boot {
          background: #12151b;
        }
        .mh-boot__side {
          background: #0c0f16;
        }
        .mh-boot__top {
          background: #13161c;
          border-bottom-color: #292e39;
        }
        .mh-boot__bar {
          background: #21252f;
        }
        .mh-boot__hint {
          color: #8d95a3;
        }
        .mh-boot__line {
          border-color: #323846;
          background: #1c2029;
        }
      }
      html[data-theme="light"] {
        background: #f3f5f8;
        color: #171a21;
      }
      html[data-theme="light"] .mh-boot {
        background: #f3f5f8;
      }
      html[data-theme="light"] .mh-boot__side {
        background: #121829;
      }
      html[data-theme="light"] .mh-boot__top {
        background: #f4f6fa;
        border-bottom-color: #edeff3;
      }
      html[data-theme="light"] .mh-boot__bar {
        background: #e9ecf1;
      }
      html[data-theme="light"] .mh-boot__hint {
        color: #6b7280;
      }
      html[data-theme="light"] .mh-boot__line {
        border-color: #e3e6ec;
        background: #ffffff;
      }
      html[data-theme="dark"] {
        background: #12151b;
        color: #e6e9ef;
      }
      html[data-theme="dark"] .mh-boot {
        background: #12151b;
      }
      html[data-theme="dark"] .mh-boot__side {
        background: #0c0f16;
      }
      html[data-theme="dark"] .mh-boot__top {
        background: #13161c;
        border-bottom-color: #292e39;
      }
      html[data-theme="dark"] .mh-boot__bar {
        background: #21252f;
      }
      html[data-theme="dark"] .mh-boot__hint {
        color: #8d95a3;
      }
      html[data-theme="dark"] .mh-boot__line {
        border-color: #323846;
        background: #1c2029;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="mh-boot">
        <div class="mh-boot__side"></div>
        <div class="mh-boot__col">
          <div class="mh-boot__top"><span class="mh-boot__bar mh-boot__bar--title"></span></div>
          <div class="mh-boot__main">
            <p class="mh-boot__hint" role="status">正在加载…</p>
            <div class="mh-boot__lines">
              <span class="mh-boot__line"></span>
              <span class="mh-boot__line"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
